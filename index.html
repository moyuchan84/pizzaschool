<title>🌟 우리반 상벌점 시스템</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg1:#0A0E1A;--bg2:#16083A;
  --glass:rgba(255,255,255,0.07);--glass-b:rgba(255,255,255,0.13);
  --card:#FFFFFF;
  --gold:#FFD700;--teal:#00E5CC;--pink:#FF6FA8;
  --rwd:#3EE884;--rwd2:#27AE60;
  --pen:#FF5252;--pen2:#C0392B;
  --lt:#F0F4FF;--lm:rgba(240,244,255,0.55);
  --dk:#1A1040;--dm:#7B7299;
  --sh:0 20px 60px rgba(0,0,0,0.5);
  --r:20px;--rs:12px;--rx:8px;
  --sp:cubic-bezier(0.34,1.56,0.64,1);
  --ez:cubic-bezier(0.4,0,0.2,1);
}
html,body{min-height:100vh;font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','맑은 고딕',sans-serif;background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 100%);background-attachment:fixed;color:var(--lt);overflow-x:hidden;}

/* CANVASES */
#star-c{position:fixed;inset:0;z-index:0;pointer-events:none;}
#conf-c{position:fixed;inset:0;z-index:9999;pointer-events:none;}

/* TOAST */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(70px);background:rgba(8,12,28,0.97);color:#fff;padding:11px 22px;border-radius:100px;font-weight:700;font-size:.88rem;z-index:9000;transition:transform .4s var(--sp),opacity .3s;white-space:nowrap;border:1px solid rgba(255,255,255,.15);opacity:0;pointer-events:none;}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1;}

/* FLOAT EMOJI */
.fe{position:fixed;font-size:26px;pointer-events:none;z-index:8500;animation:fup 1.1s ease forwards;}
@keyframes fup{0%{opacity:1;transform:translateY(0) scale(1);}60%{opacity:1;transform:translateY(-65px) scale(1.4);}100%{opacity:0;transform:translateY(-110px) scale(.5);}}

/* ALERT */
#alert-ov{position:fixed;inset:0;z-index:8000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.abox{background:#fff;border-radius:26px;padding:48px 40px;text-align:center;max-width:420px;width:90%;animation:apin .5s var(--sp) both;position:relative;}
.abox.ra{border-top:5px solid var(--rwd);}
.abox.pa{border-top:5px solid var(--pen);}
@keyframes apin{from{opacity:0;transform:scale(.4) translateY(40px);}to{opacity:1;transform:scale(1) translateY(0);}}
.ae{font-size:80px;display:block;margin-bottom:12px;animation:espin .7s var(--sp) .15s both;}
@keyframes espin{from{transform:scale(0) rotate(-180deg);}to{transform:scale(1) rotate(0);}}
.an{font-size:1.8rem;font-weight:900;color:var(--dk);margin-bottom:8px;}
.am{font-size:.97rem;color:var(--dm);margin-bottom:26px;line-height:1.65;}

/* SETUP */
#setup{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .55s var(--ez),transform .55s var(--ez);}
#setup.out{opacity:0;transform:scale(.93) translateY(-28px);pointer-events:none;}
.sc{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:28px;padding:44px 48px;max-width:660px;width:100%;max-height:90vh;overflow-y:auto;animation:crise .85s var(--sp) both;box-shadow:0 40px 80px rgba(0,0,0,.55);}
@keyframes crise{from{opacity:0;transform:translateY(80px) scale(.88);}to{opacity:1;transform:translateY(0) scale(1);}}
.sh{text-align:center;margin-bottom:34px;}
.sm{font-size:72px;display:block;animation:sbob 3s ease-in-out infinite;filter:drop-shadow(0 6px 18px rgba(255,215,0,.45));}
@keyframes sbob{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-14px) rotate(6deg);}}
.st{font-size:2rem;font-weight:900;background:linear-gradient(135deg,#FFD700 0%,#FF6FA8 50%,#00E5CC 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:14px;line-height:1.2;}
.ss{color:var(--lm);font-size:.92rem;margin-top:7px;}

/* FORM */
.fg{margin-bottom:22px;}
.fl{display:block;font-size:.8rem;font-weight:700;color:var(--lm);text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px;}
.fi{width:100%;padding:13px 17px;background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.18);border-radius:var(--rs);color:var(--lt);font-size:1rem;font-family:inherit;outline:none;transition:border-color .2s,background .2s,box-shadow .2s;}
.fi::placeholder{color:rgba(240,244,255,.32);}
.fi:focus{border-color:var(--teal);background:rgba(0,229,204,.07);box-shadow:0 0 0 3px rgba(0,229,204,.18);}
.nr{display:flex;gap:10px;}.nr .fi{flex:1;}
.ca{min-height:52px;display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:rgba(255,255,255,.04);border:1.5px dashed rgba(255,255,255,.18);border-radius:var(--rs);margin-top:10px;align-items:center;}
.cp{color:var(--lm);font-size:.84rem;font-style:italic;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 8px;background:rgba(0,229,204,.13);border:1px solid rgba(0,229,204,.32);border-radius:100px;font-size:.86rem;font-weight:600;color:var(--lt);animation:cpop .28s var(--sp) both;}
@keyframes cpop{from{opacity:0;transform:scale(.3);}to{opacity:1;transform:scale(1);}}
.cr{width:18px;height:18px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:var(--lt);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.68rem;transition:background .2s;}
.cr:hover{background:rgba(255,82,82,.55);}
.srow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.sf{display:flex;flex-direction:column;gap:6px;}
.slb{font-size:.78rem;font-weight:700;text-align:center;padding:4px 8px;border-radius:100px;}
.slb.r{background:rgba(62,232,132,.18);color:var(--rwd);}
.slb.p{background:rgba(255,82,82,.18);color:var(--pen);}
.slb.g{background:rgba(255,215,0,.18);color:var(--gold);}
.sf .fi{text-align:center;font-size:1.35rem;font-weight:900;font-variant-numeric:tabular-nums;padding:12px;}
.bstart{width:100%;padding:19px;background:linear-gradient(135deg,#FFD700 0%,#FF6FA8 60%,#00E5CC 100%);background-size:200% 200%;animation:grad 4s ease infinite;border:none;border-radius:var(--rs);font-size:1.22rem;font-weight:900;font-family:inherit;color:#1A1040;cursor:pointer;margin-top:6px;box-shadow:0 8px 28px rgba(255,215,0,.38);transition:transform .2s var(--sp),box-shadow .2s;}
@keyframes grad{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.bstart:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 16px 44px rgba(255,215,0,.5);}
.bstart:active{transform:scale(.98);}
.rsec{margin-top:14px;text-align:center;}
.rh{font-size:.8rem;color:var(--lm);margin-bottom:9px;}

/* BTNS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:var(--rx);border:none;font-family:inherit;font-size:.86rem;font-weight:700;cursor:pointer;transition:transform .18s var(--sp),box-shadow .18s,opacity .18s;}
.btn:hover{transform:translateY(-2px) scale(1.04);}
.btn:active{transform:scale(.96);}
.bg{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.18);color:var(--lt);}
.bg:hover{background:rgba(255,255,255,.17);}
.bt{background:linear-gradient(135deg,#00C9B1,#00E5CC);color:#0A1520;box-shadow:0 4px 14px rgba(0,229,204,.32);}
.bred{background:linear-gradient(135deg,var(--pen2),var(--pen));color:#fff;box-shadow:0 4px 14px rgba(255,82,82,.32);}
.bgold{background:linear-gradient(135deg,#C8960E,var(--gold));color:#1A1040;box-shadow:0 4px 14px rgba(255,215,0,.32);}

/* MAIN */
#main{position:relative;z-index:1;min-height:100vh;padding:20px;display:flex;flex-direction:column;gap:18px;}
.mh{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:17px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.mht{font-size:1.45rem;font-weight:900;background:linear-gradient(90deg,var(--gold),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.mhm{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;}
.mt{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:100px;}
.mt.r{background:rgba(62,232,132,.18);color:var(--rwd);}
.mt.p{background:rgba(255,82,82,.18);color:var(--pen);}
.mt.g{background:rgba(255,215,0,.18);color:var(--gold);}
.ha{display:flex;gap:8px;flex-wrap:wrap;}
.mb{display:grid;grid-template-columns:1fr 260px;gap:18px;align-items:start;}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}

/* STUDENT CARD */
.scard{background:#fff;border-radius:22px;padding:22px 18px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .3s var(--sp),box-shadow .3s;border:3px solid transparent;cursor:default;}
.scard::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--ca,#FFD700);border-radius:22px 22px 0 0;}
.scard:hover{transform:translateY(-8px);box-shadow:0 32px 72px rgba(0,0,0,.55);}
.scard.p1{border-color:rgba(255,215,0,.55);box-shadow:0 0 28px rgba(255,215,0,.22),var(--sh);}
.scard.p2{border-color:rgba(192,192,192,.45);}
.scard.p3{border-color:rgba(205,127,50,.45);}
.scard.pn{border-color:rgba(255,215,0,.25);}
.scard.shk{animation:cshk .5s ease;}
.scard.glw{animation:cglw .55s ease;}
@keyframes cshk{0%,100%{transform:translateX(0);}15%{transform:translateX(-10px) rotate(-1.5deg);}35%{transform:translateX(10px) rotate(1.5deg);}55%{transform:translateX(-6px);}75%{transform:translateX(6px);}90%{transform:translateX(-3px);}}
@keyframes cglw{0%,100%{box-shadow:var(--sh);}40%{box-shadow:0 0 40px rgba(62,232,132,.52),var(--sh);}}
.rb{position:absolute;top:10px;right:10px;font-size:1.45rem;animation:rba 2.5s ease-in-out infinite;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));}
@keyframes rba{0%,100%{transform:scale(1);}50%{transform:scale(1.28);}}
.av{text-align:center;font-size:56px;display:block;margin-bottom:9px;animation:avf var(--fd,4s) ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(0,0,0,.14));}
@keyframes avf{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-8px) rotate(4deg);}}
.cn{text-align:center;font-size:1.08rem;font-weight:900;color:var(--dk);margin-bottom:15px;}
.ps{margin-bottom:9px;}
.pr{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:.76rem;font-weight:700;}
.pl{color:var(--dm);}
.pv{font-size:.83rem;font-weight:900;font-variant-numeric:tabular-nums;}
.pv.r{color:var(--rwd2);}
.pv.p{color:var(--pen2);}
.pt{height:9px;border-radius:100px;background:#EEE;overflow:hidden;}
.pf{height:100%;border-radius:100px;transition:width .7s var(--sp);position:relative;overflow:hidden;}
.pf::after{content:'';position:absolute;top:0;left:-100%;right:100%;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shim 2.5s ease-in-out infinite;}
@keyframes shim{0%{left:-100%;right:100%;}100%{left:100%;right:-100%;}}
.pf.rw{background:linear-gradient(90deg,#27AE60,#3EE884);}
.pf.pw{background:linear-gradient(90deg,#C0392B,#FF5252);}
.cbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px;}
.cb{padding:9px 5px;border:none;border-radius:var(--rx);font-family:inherit;font-size:.76rem;font-weight:800;cursor:pointer;transition:transform .15s var(--sp),box-shadow .15s;display:flex;align-items:center;justify-content:center;gap:3px;}
.cb:hover{transform:translateY(-2px) scale(1.06);}
.cb:active{transform:scale(.93);}
.cbr{background:linear-gradient(135deg,#27AE60,#3EE884);color:#fff;box-shadow:0 3px 10px rgba(39,174,96,.38);}
.cbr:hover{box-shadow:0 6px 18px rgba(39,174,96,.5);}
.cbp{background:linear-gradient(135deg,#C0392B,#FF5252);color:#fff;box-shadow:0 3px 10px rgba(255,82,82,.38);}
.cbp:hover{box-shadow:0 6px 18px rgba(255,82,82,.5);}

/* RANKING */
.rp{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:sticky;top:20px;}
.rpt{font-size:.95rem;font-weight:900;color:var(--gold);margin-bottom:15px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.05em;}
.rl{display:flex;flex-direction:column;gap:6px;max-height:68vh;overflow-y:auto;}
.rl::-webkit-scrollbar{width:4px;}
.rl::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px;}
.ri{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--rx);background:rgba(255,255,255,.05);}
.ri.ip{background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.24);}
.rmd{font-size:1.25rem;min-width:28px;text-align:center;}
.rn{min-width:28px;font-size:.78rem;font-weight:700;color:var(--lm);text-align:center;}
.rinf{flex:1;min-width:0;}
.rname{font-size:.86rem;font-weight:700;color:var(--lt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rsub{font-size:.71rem;color:var(--lm);margin-top:1px;}
.rsc{font-size:1rem;font-weight:900;color:var(--rwd);font-variant-numeric:tabular-nums;}
.pdiv{margin:6px 0;position:relative;height:1px;background:linear-gradient(90deg,transparent,rgba(255,215,0,.45),transparent);}
.pdiv::before{content:'✦ 상 수여 기준선 ✦';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg1);padding:2px 8px;font-size:.62rem;font-weight:700;color:var(--gold);white-space:nowrap;letter-spacing:.05em;}

/* MODAL */
.mwrap{position:fixed;inset:0;z-index:7000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.68);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.mcard{background:#111827;border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:34px;max-width:460px;width:90%;animation:apin .4s var(--sp) both;}
.mtitle{font-size:1.25rem;font-weight:900;color:var(--lt);margin-bottom:18px;}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}

/* RED FLASH */
@keyframes bfr{0%,100%{background:none;}35%{background:rgba(255,50,50,.11);}}
body.fr{animation:bfr .5s ease;}

/* RESPONSIVE */
@media(max-width:860px){.mb{grid-template-columns:1fr;}}
@media(max-width:580px){
  .sc{padding:26px 18px;}
  .srow{grid-template-columns:1fr;}
  .sg{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
  .mhm{display:none;}
  .mht{font-size:1.2rem;}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}}
</style>

<canvas id="star-c"></canvas>
<canvas id="conf-c"></canvas>
<div id="toast"></div>
<div id="alert-ov" style="display:none;"></div>

<!-- EDIT MODAL -->
<div id="emod" class="mwrap" style="display:none;">
  <div class="mcard" onclick="event.stopPropagation()">
    <div class="mtitle">✏️ 학생 편집</div>
    <div class="fg">
      <div class="nr">
        <input type="text" class="fi" id="mod-in" placeholder="이름 입력 (쉼표로 여러 명)">
        <button class="btn bt" onclick="addMod()">추가</button>
      </div>
    </div>
    <div class="ca" id="mod-ca"><span class="cp">학생이 없어요</span></div>
    <div class="mact">
      <button class="btn bg" onclick="closeMod()">취소</button>
      <button class="btn bgold" onclick="saveMod()">저장 ✓</button>
    </div>
  </div>
</div>

<!-- SETUP SCREEN -->
<div id="setup">
  <div class="sc">
    <div class="sh">
      <span class="sm">⭐</span>
      <h1 class="st">우리반 상벌점 시스템</h1>
      <p class="ss">선생님, 먼저 설정을 해주세요! 🎉</p>
    </div>
    <div class="fg">
      <label class="fl">🏫 반 이름</label>
      <input type="text" class="fi" id="in-cn" placeholder="예) 3학년 2반, 꿈나무반..." maxlength="20">
    </div>
    <div class="fg">
      <label class="fl">👦 학생 이름 추가</label>
      <div class="nr">
        <input type="text" class="fi" id="in-st" placeholder="이름 입력 후 Enter (쉼표로 여러 명 가능)" maxlength="40">
        <button class="btn bt" onclick="addSS()">추가 ＋</button>
      </div>
      <div class="ca" id="ss-ca"><span class="cp" id="ss-empty">이름을 추가해주세요!</span></div>
    </div>
    <div class="fg">
      <label class="fl">⚙️ 점수 설정</label>
      <div class="srow">
        <div class="sf"><div class="slb r">⭐ 상점 한도</div><input type="number" class="fi" id="in-rl" value="10" min="1" max="99"></div>
        <div class="sf"><div class="slb p">💢 벌점 한도</div><input type="number" class="fi" id="in-pl" value="5" min="1" max="99"></div>
        <div class="sf"><div class="slb g">🏆 상 주는 순위</div><input type="number" class="fi" id="in-pr" value="3" min="1" max="20"></div>
      </div>
    </div>
    <button class="bstart" onclick="goMain()">🚀 시작하기!</button>
    <div class="rsec" id="rsec" style="display:none;">
      <p class="rh" id="rh"></p>
      <button class="btn bg" style="width:100%;padding:12px;font-size:.93rem;" onclick="resume()">📂 이전 수업 이어서 하기</button>
    </div>
  </div>
</div>

<!-- MAIN SCREEN -->
<div id="main" style="display:none;">
  <div class="mh">
    <div>
      <div class="mht" id="mtitle">🌟 우리반 상벌점</div>
      <div class="mhm">
        <span class="mt r" id="hrl">⭐ 상점 한도 10</span>
        <span class="mt p" id="hpl">💢 벌점 한도 5</span>
        <span class="mt g" id="hpr">🏆 상위 3명</span>
      </div>
    </div>
    <div class="ha">
      <button class="btn bg" onclick="openMod()">✏️ 학생 편집</button>
      <button class="btn bg" onclick="doReset()">🔄 초기화</button>
      <button class="btn bg" onclick="goSetup()">⚙️ 설정</button>
    </div>
  </div>
  <div class="mb">
    <div class="sg" id="sg"></div>
    <div class="rp">
      <div class="rpt">🏆 실시간 랭킹</div>
      <ul class="rl" id="rl"></ul>
    </div>
  </div>
</div>

<script>
// ── STAR BACKGROUND ──────────────────────────────
(function(){
  const c=document.getElementById('star-c'),x=c.getContext('2d');
  let W,H,ss=[];
  function rsz(){W=c.width=innerWidth;H=c.height=innerHeight;}
  rsz();addEventListener('resize',rsz);
  function mk(){return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,a:Math.random(),da:(Math.random()*.005+.001)*(Math.random()>.5?1:-1),vy:Math.random()*.25+.04,vx:(Math.random()-.5)*.1};}
  for(let i=0;i<130;i++)ss.push(mk());
  function draw(){
    x.clearRect(0,0,W,H);
    ss.forEach(s=>{
      s.a=Math.max(.08,Math.min(1,s.a+s.da));
      if(s.a<=.09||s.a>=.99)s.da*=-1;
      s.y-=s.vy;s.x+=s.vx;
      if(s.y<-2){s.y=H+2;s.x=Math.random()*W;}
      if(s.x<0||s.x>W)s.x=Math.random()*W;
      x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);
      x.fillStyle=`rgba(240,244,255,${s.a})`;x.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── CONFETTI ─────────────────────────────────────
const CC=document.getElementById('conf-c'),CX=CC.getContext('2d');
CC.width=innerWidth;CC.height=innerHeight;
addEventListener('resize',()=>{CC.width=innerWidth;CC.height=innerHeight;});
const COLS=['#FFD700','#FF6FA8','#00E5CC','#3EE884','#FF5252','#A78BFA','#FB923C'];
let cps=[],craf=null;
function CP(x,y,big){
  this.x=x;this.y=y;
  this.vx=(Math.random()-.5)*(big?17:9);
  this.vy=(Math.random()-.5)*(big?17:9)-(big?9:4);
  this.g=big?.36:.26;this.decay=.965;this.alpha=1;
  this.r=big?Math.random()*8+4:Math.random()*5+2;
  this.color=COLS[Math.floor(Math.random()*COLS.length)];
  this.rect=Math.random()>.5;this.rot=Math.random()*Math.PI*2;
  this.rv=(Math.random()-.5)*.24;
}
CP.prototype.step=function(){this.vx*=this.decay;this.vy=this.vy*this.decay+this.g;this.x+=this.vx;this.y+=this.vy;this.alpha-=.013;this.rot+=this.rv;};
CP.prototype.draw=function(){
  CX.save();CX.globalAlpha=Math.max(0,this.alpha);CX.fillStyle=this.color;
  CX.translate(this.x,this.y);CX.rotate(this.rot);
  if(this.rect)CX.fillRect(-this.r,-this.r/2,this.r*2,this.r);
  else{CX.beginPath();CX.arc(0,0,this.r,0,Math.PI*2);CX.fill();}
  CX.restore();
};
function runConf(){
  CX.clearRect(0,0,CC.width,CC.height);
  cps=cps.filter(p=>p.alpha>.01);
  cps.forEach(p=>{p.step();p.draw();});
  if(cps.length>0)craf=requestAnimationFrame(runConf);
  else{CX.clearRect(0,0,CC.width,CC.height);craf=null;}
}
function spawnConf(x,y,n,big){
  for(let i=0;i<n;i++)cps.push(new CP(x,y,big));
  if(!craf)craf=requestAnimationFrame(runConf);
}
function bigCelebration(){
  const cx=CC.width/2,cy=CC.height*.35;
  spawnConf(cx,cy,180,true);
  const shoot=(x,y,vxb)=>{for(let i=0;i<60;i++){const p=new CP(x,y,true);p.vx=vxb+(Math.random()-.5)*5;p.vy=-(Math.random()*14+7);cps.push(p);}};
  shoot(0,CC.height*.75,12);shoot(CC.width,CC.height*.75,-12);
  if(!craf)craf=requestAnimationFrame(runConf);
  [350,700,1050].forEach(d=>setTimeout(()=>spawnConf(Math.random()*CC.width,Math.random()*CC.height*.5,55,true),d));
}
function smallBurst(el){
  const rc=el.getBoundingClientRect();
  spawnConf(rc.left+rc.width/2,rc.top+rc.height/3,22,false);
}

// ── DATA ─────────────────────────────────────────
const AVS=['🦁','🐯','🐼','🦊','🐸','🦋','🐧','🦜','🐬','🦄','🐳','🦒','🐘','🦝','🐙','🦀','🐞','🦖','🦕','🐶','🐱','🐭','🐹','🐰','🐻','🐮','🐷','🐥','🦅','🐠'];
const ACS=['#FF6B6B','#FF8C42','#FFD700','#7BC67E','#4ECDC4','#5B9BD5','#9B59B6','#FF6FA8','#00C9B1','#F0A500'];
let nid=1,students=[],cfg={className:'',rewardLimit:10,penaltyLimit:5,prizeRank:3},tmpSt=[];

function mkSt(name,idx){
  return{id:nid++,name,avatar:AVS[idx%AVS.length],accent:ACS[idx%ACS.length],rp:0,pp:0,fd:(3.5+Math.random()*2).toFixed(1)+'s'};
}
function parseNames(v){return v.split(/[,，、]+/).map(s=>s.trim()).filter(s=>s.length>0);}

// ── SETUP SCREEN ─────────────────────────────────
document.getElementById('in-st').addEventListener('keydown',e=>{if(e.key==='Enter')addSS();});

function addSS(){
  const inp=document.getElementById('in-st'),ns=parseNames(inp.value);
  if(!ns.length)return;
  ns.forEach(n=>{if(!students.find(s=>s.name===n))students.push(mkSt(n,students.length));});
  inp.value='';renderSSChips();inp.focus();
}
function remSS(id){students=students.filter(s=>s.id!==id);renderSSChips();}
function renderSSChips(){
  const a=document.getElementById('ss-ca');
  if(!students.length){a.innerHTML='<span class="cp">이름을 추가해주세요!</span>';return;}
  a.innerHTML=students.map(s=>`<div class="chip"><span>${s.avatar}</span><span>${s.name}</span><button class="cr" onclick="remSS(${s.id})">✕</button></div>`).join('');
}

function goMain(){
  if(!students.length){toast('❌ 학생을 먼저 추가해주세요!');return;}
  const rl=parseInt(document.getElementById('in-rl').value)||10;
  const pl=parseInt(document.getElementById('in-pl').value)||5;
  const pr=parseInt(document.getElementById('in-pr').value)||3;
  if(rl<1||pl<1||pr<1){toast('❌ 값을 올바르게 입력해주세요!');return;}
  cfg={className:document.getElementById('in-cn').value.trim()||'우리반',rewardLimit:rl,penaltyLimit:pl,prizeRank:pr};
  const el=document.getElementById('setup');
  el.classList.add('out');
  setTimeout(()=>{el.style.display='none';document.getElementById('main').style.display='flex';initMain();save();},580);
}
function goSetup(){
  if(!confirm('설정 화면으로 돌아갈까요?'))return;
  document.getElementById('main').style.display='none';
  const el=document.getElementById('setup');el.style.display='flex';el.classList.remove('out');
  document.getElementById('in-cn').value=cfg.className;
  document.getElementById('in-rl').value=cfg.rewardLimit;
  document.getElementById('in-pl').value=cfg.penaltyLimit;
  document.getElementById('in-pr').value=cfg.prizeRank;
  renderSSChips();
}
function resume(){
  const el=document.getElementById('setup');el.classList.add('out');
  setTimeout(()=>{el.style.display='none';document.getElementById('main').style.display='flex';initMain();},580);
}

// ── MAIN SCREEN ──────────────────────────────────
function initMain(){
  document.getElementById('mtitle').textContent=`🌟 ${cfg.className} 상벌점`;
  document.getElementById('hrl').textContent=`⭐ 상점 한도 ${cfg.rewardLimit}`;
  document.getElementById('hpl').textContent=`💢 벌점 한도 ${cfg.penaltyLimit}`;
  document.getElementById('hpr').textContent=`🏆 상위 ${cfg.prizeRank}명`;
  renderGrid();renderRanking();
}
function sorted(){return[...students].sort((a,b)=>b.rp!==a.rp?b.rp-a.rp:a.pp-b.pp);}
function rankOf(id){return sorted().findIndex(s=>s.id===id)+1;}
function rEmoji(r){return r===1?'👑':r===2?'🥈':r===3?'🥉':'🏅';}
function rClass(r){return r===1?'p1':r===2?'p2':r===3?'p3':r<=cfg.prizeRank?'pn':'';}

function renderGrid(){
  const g=document.getElementById('sg');
  if(!students.length){g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px;opacity:.45;"><div style="font-size:64px;margin-bottom:12px;">🏫</div><p>학생이 없어요!</p></div>';return;}
  g.innerHTML=students.map(s=>{
    const r=rankOf(s.id),rp=Math.min(100,s.rp/cfg.rewardLimit*100),pp=Math.min(100,s.pp/cfg.penaltyLimit*100);
    return`<div class="scard ${rClass(r)}" id="c${s.id}" style="--ca:${s.accent};">
      ${r<=cfg.prizeRank?`<div class="rb">${rEmoji(r)}</div>`:''}
      <div class="av" style="--fd:${s.fd};">${s.avatar}</div>
      <div class="cn">${s.name}</div>
      <div class="ps"><div class="pr"><span class="pl">⭐ 상점</span><span class="pv r" id="rv${s.id}">${s.rp} / ${cfg.rewardLimit}</span></div><div class="pt"><div class="pf rw" id="rb${s.id}" style="width:${rp}%;"></div></div></div>
      <div class="ps"><div class="pr"><span class="pl">💢 벌점</span><span class="pv p" id="pv${s.id}">${s.pp} / ${cfg.penaltyLimit}</span></div><div class="pt"><div class="pf pw" id="pb${s.id}" style="width:${pp}%;"></div></div></div>
      <div class="cbs"><button class="cb cbr" onclick="addPt(${s.id},'r')">⭐ 상점 +1</button><button class="cb cbp" onclick="addPt(${s.id},'p')">💢 벌점 +1</button></div>
    </div>`;
  }).join('');
}

function patchCard(id){
  const s=students.find(x=>x.id===id),card=document.getElementById('c'+id);
  if(!s||!card)return;
  const r=rankOf(id),rp=Math.min(100,s.rp/cfg.rewardLimit*100),pp=Math.min(100,s.pp/cfg.penaltyLimit*100);
  card.className=`scard ${rClass(r)}`;card.style.setProperty('--ca',s.accent);
  document.getElementById('rv'+id).textContent=`${s.rp} / ${cfg.rewardLimit}`;
  document.getElementById('rb'+id).style.width=rp+'%';
  document.getElementById('pv'+id).textContent=`${s.pp} / ${cfg.penaltyLimit}`;
  document.getElementById('pb'+id).style.width=pp+'%';
  const ex=card.querySelector('.rb');
  if(r<=cfg.prizeRank){if(ex)ex.textContent=rEmoji(r);else{const b=document.createElement('div');b.className='rb';b.textContent=rEmoji(r);card.appendChild(b);}}
  else if(ex)ex.remove();
}

function renderRanking(){
  const list=document.getElementById('rl'),sr=sorted();
  let h='';
  sr.forEach((s,i)=>{
    const r=i+1,ip=r<=cfg.prizeRank,med=r<=3?rEmoji(r):null;
    h+=`<li class="ri ${ip?'ip':''}">
      ${med?`<div class="rmd">${med}</div>`:`<div class="rn">${r}</div>`}
      <div class="rinf"><div class="rname">${s.avatar} ${s.name}</div><div class="rsub">⭐${s.rp} &nbsp;💢${s.pp}</div></div>
      <div class="rsc">+${s.rp}</div></li>`;
    if(r===cfg.prizeRank&&r<sr.length)h+='<div class="pdiv"></div>';
  });
  list.innerHTML=h;
}

// ── POINTS ───────────────────────────────────────
function addPt(id,type){
  const s=students.find(x=>x.id===id);if(!s)return;
  const card=document.getElementById('c'+id);
  if(type==='r'){
    if(s.rp>=cfg.rewardLimit){toast(`${s.name} 학생은 이미 상점 한도에 도달했어요!`);return;}
    s.rp++;fe('⭐',card);anim(card,'glw');smallBurst(card);
    if(s.rp>=cfg.rewardLimit)setTimeout(()=>showRA(s),260);
  }else{
    if(s.pp>=cfg.penaltyLimit){toast(`${s.name} 학생은 이미 벌점 한도에 도달했어요!`);return;}
    s.pp++;fe('💢',card);anim(card,'shk');
    document.body.classList.remove('fr');void document.body.offsetWidth;document.body.classList.add('fr');
    setTimeout(()=>document.body.classList.remove('fr'),600);
    if(s.pp>=cfg.penaltyLimit)setTimeout(()=>showPA(s),260);
  }
  patchCard(id);renderRanking();save();
}
function anim(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);el.addEventListener('animationend',()=>el.classList.remove(cls),{once:true});}
function fe(emoji,ref){
  const rc=ref.getBoundingClientRect(),el=document.createElement('div');
  el.className='fe';el.textContent=emoji;
  el.style.left=(rc.left+rc.width/2-13)+'px';el.style.top=(rc.top+rc.height/2-13)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1200);
}

// ── ALERTS ───────────────────────────────────────
function showRA(s){
  bigCelebration();
  const ov=document.getElementById('alert-ov');ov.style.display='flex';
  ov.innerHTML=`<div class="abox ra"><span class="ae">🎉</span><div class="an">${s.name} 학생!</div><div class="am">상점 한도 <strong>${cfg.rewardLimit}점</strong> 달성! 🌟<br>정말 잘했어요! 모두 박수!</div><button class="btn bt" style="font-size:1rem;padding:12px 30px;" onclick="closeAlert()">짝짝짝! 👏</button></div>`;
}
function showPA(s){
  const ov=document.getElementById('alert-ov');ov.style.display='flex';
  ov.innerHTML=`<div class="abox pa"><span class="ae">😱</span><div class="an">${s.name} 학생!</div><div class="am">벌점 한도 <strong>${cfg.penaltyLimit}점</strong>에 도달했어요!<br>이제부터 더욱 조심해야 해요! 💪</div><button class="btn bred" style="font-size:1rem;padding:12px 30px;" onclick="closeAlert()">알겠어요! 😊</button></div>`;
}
function closeAlert(){document.getElementById('alert-ov').style.display='none';}

// ── TOAST ────────────────────────────────────────
let tmt;
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');
  clearTimeout(tmt);tmt=setTimeout(()=>el.classList.remove('on'),2800);
}

// ── RESET ────────────────────────────────────────
function doReset(){
  if(!confirm('모든 학생의 점수를 초기화할까요?'))return;
  students.forEach(s=>{s.rp=0;s.pp=0;});renderGrid();renderRanking();save();toast('✅ 모든 점수가 초기화됐어요!');
}

// ── EDIT MODAL ───────────────────────────────────
function openMod(){tmpSt=students.map(s=>({...s}));renderModChips();document.getElementById('emod').style.display='flex';document.getElementById('mod-in').focus();}
function closeMod(){document.getElementById('emod').style.display='none';}
document.getElementById('emod').addEventListener('click',e=>{if(e.target===document.getElementById('emod'))closeMod();});
document.getElementById('mod-in').addEventListener('keydown',e=>{if(e.key==='Enter')addMod();});
function addMod(){
  const inp=document.getElementById('mod-in'),ns=parseNames(inp.value);
  if(!ns.length)return;
  ns.forEach(n=>{if(!tmpSt.find(s=>s.name===n))tmpSt.push(mkSt(n,tmpSt.length));});
  inp.value='';renderModChips();inp.focus();
}
function remMod(id){tmpSt=tmpSt.filter(s=>s.id!==id);renderModChips();}
function renderModChips(){
  const a=document.getElementById('mod-ca');
  if(!tmpSt.length){a.innerHTML='<span class="cp">학생이 없어요</span>';return;}
  a.innerHTML=tmpSt.map(s=>`<div class="chip"><span>${s.avatar}</span><span>${s.name}</span><button class="cr" onclick="remMod(${s.id})">✕</button></div>`).join('');
}
function saveMod(){students=tmpSt;closeMod();renderGrid();renderRanking();save();toast('✅ 학생 명단이 업데이트됐어요!');}

// ── PERSISTENCE ──────────────────────────────────
function save(){try{localStorage.setItem('sbp',JSON.stringify({students,cfg,nid}));}catch(_){}}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('sbp'));
    if(d&&d.students&&d.cfg&&d.students.length>0){students=d.students;cfg=d.cfg;if(d.nid)nid=d.nid;return true;}
  }catch(_){}return false;
}
if(load()){
  document.getElementById('in-cn').value=cfg.className;
  document.getElementById('in-rl').value=cfg.rewardLimit;
  document.getElementById('in-pl').value=cfg.penaltyLimit;
  document.getElementById('in-pr').value=cfg.prizeRank;
  renderSSChips();
  document.getElementById('rsec').style.display='block';
  document.getElementById('rh').textContent=`💾 저장된 데이터: ${cfg.className} · 학생 ${students.length}명`;
}
</script>
